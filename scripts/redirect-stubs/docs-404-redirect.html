<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>页面不存在</title>
  <script>
    (function () {
      var p = window.location.pathname;
      // 旧文档站路径 /MikuMikuAR/docs/... 已上提至 Pages 根 /MikuMikuAR/。
      // 命中遗留 /docs/ 段：剥离后跳回根（文档首页），一跳到位。
      // 其余 404：不跳转，保留 404 语义——既避免掩盖坏链，也避免根 index.html
      // 缺失时 404 → 跳根 → 再 404 的无限重定向。
      if (p.indexOf('/MikuMikuAR/docs/') !== -1) {
        window.location.replace(p.replace(/\/MikuMikuAR\/docs\//, '/MikuMikuAR/'));
      }
    })();
  </script>
</head>
<body>
  <h1>404 — 页面不存在</h1>
  <p>请访问 <a href="/MikuMikuAR/">文档中心</a> 或 <a href="/MikuMikuAR/app/">在线应用</a>。</p>
</body>
</html>
