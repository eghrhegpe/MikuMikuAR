version: '3'

vars:
  APP_NAME: "MikuMikuAR"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # 版本号：dev 模式直接用 "dev"，正式构建通过环境变量注入
  APP_VERSION: '{{.APP_VERSION | default "dev"}}'
  BUILD_TIME: '{{.BUILD_TIME | default "unknown"}}'
  COMMIT_HASH: '{{.COMMIT_HASH | default "unknown"}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  check:goerr:
    summary: ADR-117 防回归 — Go/前端错误 i18n 静态检查（strict）
    cmds:
      - cmd: node scripts/goerr-lint.mjs --strict
        silent: true

  verify:
    summary: 本地全量门禁（tsc + eslint + goerr-lint + doc-drift），推送前用
    cmds:
      - cmd: cd frontend && npm run check
        silent: true
      - cmd: cd frontend && npm run lint
        silent: true
      - task: check:goerr
      - cmd: node scripts/check-doc-drift.mjs
        silent: true

  diff-coverage:
    summary: P8-A diff-coverage 门禁（改动源码 <60% 行覆盖率即阻塞）
    cmds:
      - cmd: cd frontend && npm run test:diff-coverage
        silent: true

  deadcode:baseline:
    summary: knip + jscpd 死代码/重复代码基线治理（回退则阻塞）
    cmds:
      - cmd: cd frontend && npm run deadcode:baseline
        silent: true

  diagnose:
    summary: 全量项目诊断（由快到慢，覆盖所有质量维度）
    cmds:
      # ── 秒级 ──
      - task: check:status
      - cmd: npm run check:funcmap
        silent: true
      - cmd: cd frontend && npm run lint
        silent: true
      - task: check:goerr
      - cmd: cd frontend && npm run check:i18n
        silent: true
      - cmd: cd frontend && npm run check:icons
        silent: true
      - cmd: cd frontend && npm run format:check
        silent: true
      - cmd: npm run check:circular
        silent: true
      - task: deadcode:baseline
      - task: check:docs
      # ── 分钟级 ──
      - cmd: cd frontend && npm test
        silent: true

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
