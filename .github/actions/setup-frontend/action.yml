# Setup Frontend —— 统一前端环境（setup-node + 可选 npm ci）
#
# 消除 ci / web-pages / webgl-weekly / release / cache-warm 各 workflow 中重复的
# setup-node + npm ci 样板，Node 版本单点维护（改这里即可全局升级）。
#
# ⚠️ 注意：本 composite action **不含** actions/checkout —— GitHub 在 job 首个 step
# 执行前就要解析本地 action 的 action.yml（此时工作区为空），把 checkout 放内部
# 会导致「Can't find action.yml」秒挂。调用方必须先在 steps 里 checkout。
#
# 两种用法：
#  1. 默认（常规测试/构建 job：ci / web-pages / webgl-weekly）
#     npm-ci: true（默认）→ 无条件 npm ci，setup-node 自带 npm 缓存（cache: npm）。
#  2. 自定义缓存系（release / cache-warm）
#     npm-ci: false → 由调用方保留自己的 actions/cache（key 与 release.yml 对齐）
#     与条件 npm ci（缓存命中跳过）。cache 仍传 'npm'：setup-node 的 ~/.npm 缓存
#     与 node_modules 整体缓存（actions/cache）是两个独立缓存维度。
#
# 注意：composite action 内部 step 的 shell 必须显式指定（不继承 job defaults），
# 统一用 bash；working-directory 默认 frontend，可通过输入覆盖。

name: Setup Frontend
description: 统一 Node 环境：setup-node + 可选 npm ci（调用方需先 checkout）

inputs:
  node-version:
    description: Node.js 版本（默认跟随仓库级变量 vars.NODE_VERSION，未设时回退 24）
    required: false
    default: '24'
  working-directory:
    description: 前端目录（相对仓库根）
    required: false
    default: frontend
  cache:
    description: setup-node 的 npm 缓存开关（'npm' 启用，'' 禁用）
    required: false
    default: npm
  npm-ci:
    description: 是否执行 npm ci（release/cache-warm 传 false 自行管理依赖安装）
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        # 版本单点：本 action 内部**不能**用 vars/env 上下文（GitHub 限制，
        # composite action 表达式只支持 inputs/github 等），否则整个 action 解析
        # 失败、所有 workflow 秒挂（e4f537a4 教训）。由调用方在 workflow 层解析：
        #   node-version: ${{ vars.NODE_VERSION || '24' }}
        # （release/cache-warm 走 env.NODE_VERSION，env 值同样引用 vars）。
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      if: inputs.npm-ci == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
