# ADR-177 Phase 3: 主应用 Web 入口 → GitHub Pages 自动部署
#
# 将主应用 web 入口（index.web.html，完整菜单 + 场景 + 模型加载）构建并部署到 GitHub Pages。
# 仓库 eghrhegpe/MikuMikuAR → 根路径(文档站) https://eghrhegpe.github.io/MikuMikuAR/ ；主应用 https://eghrhegpe.github.io/MikuMikuAR/app/
#
# 触发条件：main 分支 push 且 web 入口相关文件改动时。
# 部署方式：官方 actions/deploy-pages（artifact 上传，无需 gh-pages 分支）。
#
# 前置：仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: Web — GitHub Pages Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/index.web.html'
      - 'frontend/vite.web.config.ts'
      - 'frontend/src/**'
      - 'frontend/bindings/**'
      - 'docs/**'
      - '.github/workflows/web-pages.yml'
      - 'scripts/redirect-stubs/**'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write # deploy-pages 需要

# 同一时间只允许一个部署，新部署取消旧的
concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Vite build cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.vite
          key: vite-web-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/vite.web.config.ts', 'frontend/src/**', 'frontend/bindings/**') }}
          restore-keys: |
            vite-web-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
            vite-web-${{ runner.os }}-

      - name: Generate locale JSON (build artifact, gitignored)
        # [doc:perf] 语言包为运行时 fetch JSON，由 scripts/generate-locale-json.mjs 从
        # src/core/i18n/locales/*.ts 编译到 public/locales/（.gitignore 排除，不入库）。
        # CI checkout 后该目录为空，必须先跑生成脚本，否则 dist-web 缺语言包 →
        # 线上请求 locales/zh-CN.json 404 → t() 全部回退 key 字符串（界面文本挂死）。
        run: node ../scripts/generate-locale-json.mjs

      - name: Build web entry (production)
        # [doc:adr-177] Phase 3 主应用 web 入口生产构建
        # 不 externalize babylon / base=/MikuMikuAR/app/ / @wailsio/runtime stub
        # 产物输出到 frontend/dist-web/app/
        # [doc:adr-099][doc:adr-133] VITE_MMD_WASM_MT=1 令 __MMD_ENABLE_MPR__=true，将 MPR
        # 多线程物理 worker/wasm 编入包；配合 public/sw.js 注入的 COOP/COEP（crossOriginIsolated
        # =true），网页端解锁 SharedArrayBuffer + 多线程物理。漏设则 esbuild 消除 MPR 分支 →
        # useMultiThread=false → 降级 SPR 单线程（与 Android 构建门控同轴，见 ADR-133）。
        run: npx vite build --config vite.web.config.ts
        env:
          VITE_MMD_WASM_MT: '1'

      - name: Add app index.html entry
        # GitHub Pages 默认入口是 index.html；主应用 web 入口降为 /app/ 子路径
        # （https://eghrhegpe.github.io/MikuMikuAR/app/ 自动打开）
        run: |
          mkdir -p dist-web/app
          cp dist-web/app/index.web.html dist-web/app/index.html

      - name: Build user guide (VitePress)
        # 文档中心站：docs/（VitePress，站点根 = docs/）→ dist-web/（Pages 根）
        # 主应用降为 /app/ 子路径，文档站 base=/MikuMikuAR/ 占根
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Copy guide into web dist (root)
        # 产物拷入 dist-web/（根），与 /app/ 子路径共存，一次 artifact 一次部署
        # 注意尾部 /. ：dist-web 已由上一步 vite 构建创建，直接 `cp -r src dst`
        # 会拷成 dist-web/dist/（POSIX 语义：目标存在则拷进去），导致根 index.html
        # 缺失 → 整站 404 + stub 死循环。必须拷「目录内容」而非目录本身。
        run: cp -r ../docs/.vitepress/dist/. dist-web/

      - name: Add legacy /docs/ redirect stub
        # 旧文档站路径 /MikuMikuAR/docs/ 已上提至 Pages 根 /MikuMikuAR/。
        # 旧链接落到 /docs/ 目录 → 自动跳转根；深层旧链接（/docs/...）缺失文件
        # → 由 dist-web/404.html（同 stub）剥离 /docs/ 段后兜底跳转根。
        # 非遗留路径的 404 不跳转，保留 404 语义（覆盖 VitePress 自带 404 页，
        # 换取「根缺失时不会死循环」的安全性，见 ADR-225 审核 P2）。
        run: |
          mkdir -p dist-web/docs
          cp ../scripts/redirect-stubs/docs-404-redirect.html dist-web/docs/index.html
          cp ../scripts/redirect-stubs/docs-404-redirect.html dist-web/404.html

      - name: Add tombstone service worker at root
        # [doc:adr-225] 主应用 SW 作用域已由根收缩至 /app/，但存量访客浏览器中
        # 仍注册着 scope=/MikuMikuAR/ 的旧 SW，离线回退会吐出旧 app 外壳。
        # 在根投放墓碑 SW（清 cache + unregister），使旧注册确定性注销。
        # 必须置于 VitePress 产物拷贝之后，避免被覆盖。
        run: cp ../scripts/redirect-stubs/sw-tombstone.js dist-web/sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
