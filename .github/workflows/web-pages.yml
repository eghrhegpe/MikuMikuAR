# ADR-177 Phase 3: 主应用 Web 入口 → GitHub Pages 自动部署
#
# 将主应用 web 入口（index.web.html，完整菜单 + 场景 + 模型加载）构建并部署到 GitHub Pages。
# 仓库 eghrhegpe/MikuMikuAR → 访问地址 https://eghrhegpe.github.io/MikuMikuAR/
#
# 触发条件：main 分支 push 且 web 入口相关文件改动时。
# 部署方式：官方 actions/deploy-pages（artifact 上传，无需 gh-pages 分支）。
#
# 前置：仓库 Settings → Pages → Source 选 "GitHub Actions"。
name: Web — GitHub Pages Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/index.web.html'
      - 'frontend/vite.web.config.ts'
      - 'frontend/src/**'
      - 'frontend/bindings/**'
      - 'docs/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write # deploy-pages 需要

# 同一时间只允许一个部署，新部署取消旧的
concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Vite build cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.vite
          key: vite-web-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/vite.web.config.ts', 'frontend/src/**', 'frontend/bindings/**') }}
          restore-keys: |
            vite-web-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
            vite-web-${{ runner.os }}-

      - name: Generate locale JSON (build artifact, gitignored)
        # [doc:perf] 语言包为运行时 fetch JSON，由 scripts/generate-locale-json.mjs 从
        # src/core/i18n/locales/*.ts 编译到 public/locales/（.gitignore 排除，不入库）。
        # CI checkout 后该目录为空，必须先跑生成脚本，否则 dist-web 缺语言包 →
        # 线上请求 locales/zh-CN.json 404 → t() 全部回退 key 字符串（界面文本挂死）。
        run: node ../scripts/generate-locale-json.mjs

      - name: Build web entry (production)
        # [doc:adr-177] Phase 3 主应用 web 入口生产构建
        # 不 externalize babylon / base=/MikuMikuAR/ / @wailsio/runtime stub
        # 产物输出到 frontend/dist-web/
        # [doc:adr-099][doc:adr-133] VITE_MMD_WASM_MT=1 令 __MMD_ENABLE_MPR__=true，将 MPR
        # 多线程物理 worker/wasm 编入包；配合 public/sw.js 注入的 COOP/COEP（crossOriginIsolated
        # =true），网页端解锁 SharedArrayBuffer + 多线程物理。漏设则 esbuild 消除 MPR 分支 →
        # useMultiThread=false → 降级 SPR 单线程（与 Android 构建门控同轴，见 ADR-133）。
        run: npx vite build --config vite.web.config.ts
        env:
          VITE_MMD_WASM_MT: '1'

      - name: Add index.html entry
        # GitHub Pages 默认入口是 index.html，复制 index.web.html 以支持根路径访问
        # （https://eghrhegpe.github.io/MikuMikuAR/ 自动打开）
        run: cp dist-web/index.web.html dist-web/index.html

      - name: Build user guide (VitePress)
        # 文档中心站：docs/guide（VitePress）→ dist-web/docs/ 子路径
        # 主应用 base=/MikuMikuAR/ 不动，文档站 base=/MikuMikuAR/docs/
        working-directory: docs/guide
        run: |
          npm ci
          npm run build

      - name: Copy guide into web dist
        # 产物拷入主应用 dist-web/docs/，一次 artifact 一次部署
        run: cp -r ../docs/guide/.vitepress/dist dist-web/docs

      - name: Add legacy /guide/ redirect stub
        # 旧文档站路径 /MikuMikuAR/guide/ 已迁移至 /MikuMikuAR/docs/。
        # 旧链接（README、书签、外链）落到 dist-web/guide/ → 自动跳转 /docs/；
        # 深层旧链接（/guide/knowledge/...）缺失文件 → 由 dist-web/404.html 兜底跳转。
        run: |
          mkdir -p dist-web/guide
          cp ../scripts/redirect-stubs/guide-redirect.html dist-web/guide/index.html
          cp ../scripts/redirect-stubs/docs-404-redirect.html dist-web/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
